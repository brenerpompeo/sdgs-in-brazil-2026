name: Deploy SDGs in Brazil 2026 to GitHub Pages

# Desativado o gatilho automático: o site oficial
# (sdgsinbrazil.pactoglobal.org.br) é publicado pelo projeto Vercel
# `sdgsinbrazil2026`, na conta marketing@pactoglobal.org.br. Manter o push
# aqui criava um segundo site público em brenerpompeo.github.io, com o mesmo
# conteúdo — conteúdo duplicado e dois pipelines para o mesmo produto.
# Continua executável manualmente, caso o GitHub Pages volte a ser necessário.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
